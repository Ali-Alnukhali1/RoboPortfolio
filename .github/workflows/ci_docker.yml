name: CI_docker

on:
  push:
  pull_request:

jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build Docker Image 
        run: docker build -t robobank-portfolio -f docker/Dockerfile .

      
      - name: Run Docker Container 
        run: docker run --rm robobank-portfolio


